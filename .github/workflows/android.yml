name: Build & test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mura-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  page-size-check:
    name: 16 KB page alignment
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Android 15+ requires 16 KB page alignment for 64-bit native libraries.
      - name: Check 64-bit .so alignment
        run: |
          set -e
          mkdir -p /tmp/apkcheck && cd /tmp/apkcheck
          unzip -oq "$GITHUB_WORKSPACE"/app/build/outputs/apk/debug/*.apk
          fail=0
          for so in $(find . \( -path '*arm64-v8a*' -o -path '*x86_64*' \) -name '*.so'); do
            bad=$(readelf -lW "$so" | awk '$1=="LOAD" && strtonum($NF) < 16384 {print $NF}')
            if [ -n "$bad" ]; then echo "::error::NOT 16KB aligned: $so ($bad)"; fail=1;
            else echo "ok: $so"; fi
          done
          exit $fail
